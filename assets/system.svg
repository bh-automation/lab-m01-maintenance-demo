<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" viewBox="0 0 1080 320" role="img" aria-labelledby="title desc"><title id="title">LAB-M01: drei nachvollziehbare Instandhaltungsabläufe</title><desc id="desc">Ersatzteilentnahme, Wareneingang und Schmierstoffrückmeldung führen über ein Formular zu Prüfung, Dokumentation und bedingter Nachricht.</desc><rect width="1080" height="320" fill="#f5f7f8"/><rect x="24" y="24" width="1032" height="64" fill="#252a2e"/><g font-family="Arial,sans-serif" fill="#fff"><text x="44" y="53" font-size="22" font-weight="700">LAB-M01</text><text x="44" y="75" font-size="14">Digitaler Instandhaltungsbegleiter · betreute DEMO</text></g><g fill="#fff" stroke="#4d6878" stroke-width="2"><rect x="24" y="112" width="320" height="120"/><rect x="380" y="112" width="320" height="120"/><rect x="736" y="112" width="320" height="120"/></g><g font-family="Arial,sans-serif" fill="#252a2e"><text x="44" y="146" font-size="20" font-weight="700">01  Ersatzteilentnahme</text><text x="44" y="180" font-size="17">Menge prüfen · Bestand berechnen</text><text x="44" y="209" font-size="17">Bei Bedarf: Bestandswarnung</text><text x="400" y="146" font-size="20" font-weight="700">02  Wareneingang</text><text x="400" y="180" font-size="17">Beleg prüfen · Zugang buchen</text><text x="400" y="209" font-size="17">Bei Bedarf: Warnung zurücksetzen</text><text x="756" y="146" font-size="20" font-weight="700">03  Schmierstoff</text><text x="756" y="180" font-size="17">Zuordnung und drei Bestätigungen</text><text x="756" y="209" font-size="17">Rückmeldung dokumentieren</text><text x="24" y="277" font-size="18" font-weight="700">QR / Formular → n8n-Regelprüfung → DEMO-Journal → bedingte Testmail</text><text x="24" y="302" font-size="14">Fiktive Daten · Nacheinander ausführen · Keine Maschinenfreigabe</text></g></svg>